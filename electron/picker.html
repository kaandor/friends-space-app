<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Compartilhar tela</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1e1f22; color: #f2f3f5;
      height: 100vh; display: flex; flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 12px 16px; border-bottom: 1px solid #2f3136;
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    header h1 { font-size: 14px; font-weight: 700; }
    header .hint { margin-left: auto; font-size: 11px; color: #b5bac1; }
    .grid {
      flex: 1; overflow-y: auto; padding: 12px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px; align-content: start;
    }
    .card {
      background: #2f3136; border: 2px solid transparent; border-radius: 8px;
      overflow: hidden; cursor: pointer; text-align: center;
      transition: border-color 0.12s; position: relative;
    }
    .card:hover { border-color: #5865f2; }
    .card .thumb {
      width: 100%; aspect-ratio: 16/10; background: #000;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card .thumb .ico { font-size: 34px; color: #4f545c; }
    .card .name {
      padding: 7px 8px; font-size: 11.5px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card .badge {
      position: absolute; top: 6px; left: 6px; font-size: 9px; font-weight: 800;
      background: rgba(0,0,0,0.65); padding: 2px 6px; border-radius: 4px;
      text-transform: uppercase; letter-spacing: 0.4px;
    }
    footer {
      padding: 10px 16px; border-top: 1px solid #2f3136;
      display: flex; justify-content: flex-end; flex-shrink: 0;
    }
    button {
      background: #5865f2; color: #fff; border: none; border-radius: 6px;
      padding: 7px 16px; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    button.secondary { background: #3a3d44; margin-right: 8px; }
    .loading { grid-column: 1 / -1; text-align: center; color: #b5bac1; font-size: 12px; padding: 24px 0; }
  </style>
</head>
<body>
  <header>
    <h1>Escolha o que compartilhar</h1>
    <span class="hint">Monitores ou janelas</span>
  </header>
  <div id="grid" class="grid"><div class="loading">Carregando fontes…</div></div>
  <footer>
    <button id="cancel" class="secondary">Cancelar</button>
  </footer>

  <script>
    const grid = document.getElementById('grid')
    document.getElementById('cancel').addEventListener('click', () => window.picker.cancel())

    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.picker.cancel() })

    ;(async () => {
      try {
        const sources = await window.picker.getSources()
        grid.innerHTML = ''
        if (!sources || sources.length === 0) {
          grid.innerHTML = '<div class="loading">Nenhuma fonte disponível</div>'
          return
        }
        for (const s of sources) {
          const card = document.createElement('div')
          card.className = 'card'
          card.title = s.name
          const badge = document.createElement('span')
          badge.className = 'badge'
          badge.textContent = s.kind === 'screen' ? 'Tela' : 'Janela'
          const thumb = document.createElement('div')
          thumb.className = 'thumb'
          if (s.thumbnail) {
            const img = document.createElement('img')
            img.src = s.thumbnail
            thumb.appendChild(img)
          } else {
            thumb.innerHTML = '<span class="ico">' + (s.kind === 'screen' ? '🖥' : '🗗') + '</span>'
          }
          const name = document.createElement('div')
          name.className = 'name'
          name.textContent = s.name
          card.appendChild(badge)
          card.appendChild(thumb)
          card.appendChild(name)
          card.addEventListener('click', () => window.picker.choose(s.id))
          grid.appendChild(card)
        }
      } catch {
        grid.innerHTML = '<div class="loading">Erro ao carregar as fontes</div>'
      }
    })()
  </script>
</body>
</html>
